# Kernel inputs. Everything that decides what kernel/build-kernel.sh produces lives under
# kernel/ (this file, VERSION, demo.config), so the kernel workflow can trigger on
# `kernel/**` alone. Sourced by config/common.conf for image builds and by
# kernel/build-kernel.sh directly. Bash syntax; variables consumed by stage scripts must
# be exported (pi-gen runs each *-run.sh as a child process).
#
# Not here: KERNEL_SOURCE (deb | build) is an image-side choice, set per variant in
# config/<variant>.conf.

# GitHub repository whose releases kernel-v<VERSION> hold the published package
# (created by .github/workflows/kernel.yml); stage-kernel downloads from here in deb mode.
export KERNEL_DEB_REPO="VasylHerman/pi-gen-demo"

export KERNEL_GIT_URL="https://github.com/raspberrypi/linux.git"
export KERNEL_BRANCH="rpi-6.12.y"          # same series as Bookworm's linux-image-rpi-v8 (6.12.x)
# Exact source revision. Nothing builds from a moving branch tip: release kernel-v<VERSION>
# means this commit plus demo.config. To move: `KERNEL_UPDATE=1 ./build-kernel.sh`, read
# the new hash and Linux version from deploy/kernel-release.env, pin it here, bump VERSION.
# rpi-6.12.y @ 2026-09-16, Linux 6.12.110, "misc: rp1-pio: Include maxburst in PIO_DMACTRL"
export KERNEL_COMMIT="9c40c75f681b0b8882db9b624dfec8f81ff492f2"
export KERNEL_DEFCONFIG="bcm2711_defconfig" # Pi 4 / 400 / CM4, 64-bit
export KERNEL_IMG_NAME="kernel8-demo.img"  # boot file name, installed next to the stock kernel8.img

# Source/object tree, inside the cached Docker work volume (BASE_DIR is the pi-gen checkout).
export KERNEL_SRC_DIR="${KERNEL_SRC_DIR:-${BASE_DIR:-/build/pi-gen}/work/kernel/linux}"
export KERNEL_UPDATE="${KERNEL_UPDATE:-0}" # 1 = build the branch tip instead of KERNEL_COMMIT (one-off)
export KERNEL_JOBS="${KERNEL_JOBS:-$(nproc)}"
