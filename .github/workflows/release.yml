# Build the Pi 4 release image on every version tag and publish it as a GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The image installs the kernel package published by kernel.yml as release
# kernel-v<kernel/VERSION>; it never compiles a kernel (config/release.conf,
# KERNEL_SOURCE=deb). If that release does not exist yet, this run fails early: merge
# the kernel change first. Manual runs (workflow_dispatch) only upload the image as a
# workflow artifact; tag pushes also create the release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      # Baked into file names, /etc/rpi-issue and the demo page.
      IMG_NAME: pi4-demo-${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
      PI_GEN_RELEASE: Raspberry Pi 4 custom kernel demo ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Kernel release must exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kernel-v$(tr -d '[:space:]' < kernel/VERSION)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::kernel release $tag not found; merge the kernel change (kernel.yml publishes it) before tagging an image"
            exit 1
          fi
          echo "using kernel release $tag"

      - uses: ./.github/actions/prepare-runner

      - name: Build release image
        env:
          # stage-kernel downloads the kernel release through the API with this token, so
          # the build works unchanged if the repository is private.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build-release.sh

      - name: Boot test in QEMU
        run: |
          set -eu
          . deploy/kernel-release.env
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-arm xz-utils
          scripts/qemu-smoke-test.sh deploy/image_*.img.xz "$KERNEL_RELEASE"

      - name: Collect artifacts
        run: |
          set -eu
          cd deploy
          # Drop the raw disk image the boot test extracted (it would exceed the 2 GB
          # release-asset limit; the compressed one is shipped). Not `*.img`: that would
          # also match kernel8-demo.img.
          rm -f -- image_*.img
          ls kernel8-demo.img >/dev/null
          ls -la
          . ./kernel-release.env
          sha256sum -- image_* kernel8-demo.img *.info > SHA256SUMS
          slim=$(grep -oE 'stage-slim: rootfs .*' build.log | tail -n1 || true)
          {
            echo "Raspberry Pi 4 (arm64, Bookworm) release image: custom kernel, nginx demo page, Wi-Fi and Bluetooth; build tools, stock kernels and other extras removed."
            echo
            echo "- kernel: \`$KERNEL_RELEASE\` from release [kernel-v$KERNEL_VERSION](https://github.com/${{ github.repository }}/releases/tag/kernel-v$KERNEL_VERSION) (source commit $KERNEL_COMMIT)"
            echo "- ${slim:-size: see build.log}"
            echo "- pi-gen: $(git -C ../pi-gen rev-parse --short HEAD) (${{ github.repository }}@${{ github.sha }})"
            echo "- image: \`$(ls -- image_*)\` — flash with Raspberry Pi Imager, or boot with \`./run-qemu.sh\` (needs \`kernel8-demo.img\` next to it)"
            echo "- boot-tested in QEMU on the runner before publishing"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMG_NAME }}
          retention-days: 7
          if-no-files-found: error
          path: |
            deploy/image_*
            deploy/kernel8-demo.img
            deploy/*.info
            deploy/build.log
            deploy/SHA256SUMS

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes-file deploy/RELEASE_NOTES.md \
            deploy/image_* deploy/kernel8-demo.img deploy/*.info deploy/build.log deploy/SHA256SUMS
