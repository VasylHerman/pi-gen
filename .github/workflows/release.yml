# Build the Pi 4 demo image on every version tag and publish it as a GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Runs on GitHub's arm64 runner so the arm64 chroot and the kernel build are native
# (same path as a local build on Apple Silicon). Manual runs (workflow_dispatch) only
# upload the image as a workflow artifact; tag pushes also create the release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # Baked into file names, /etc/rpi-issue and the demo page.
      IMG_NAME: pi4-demo-${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
      PI_GEN_RELEASE: Raspberry Pi 4 custom kernel demo ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Reclaim disk space
        # Hosted runners ship several GB of toolchains this build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt 2>/dev/null

      - name: Place pi-gen work directory on the largest filesystem
        # ~14 GB of stage rootfs copies and kernel objects. WORK_VOLUME accepts a host
        # path as well as a Docker volume name (both are valid `docker run --volume` sources).
        run: |
          set -eu
          best=/; bestfree=0
          for m in / /mnt "$RUNNER_TEMP"; do
            [ -d "$m" ] || continue
            free=$(df -Pk "$m" | awk 'NR==2 {print $4}')
            if [ "$free" -gt "$bestfree" ]; then best=$m; bestfree=$free; fi
          done
          work="${best%/}/pigen-work"
          sudo mkdir -p "$work"
          echo "WORK_VOLUME=$work" >> "$GITHUB_ENV"
          echo "work dir: $work ($((bestfree / 1024 / 1024)) GB free)"

      - name: Build release image
        run: ./build-release.sh

      - name: Collect artifacts
        id: collect
        run: |
          set -eu
          cd deploy
          # The raw .img would exceed the 2 GB release-asset limit; ship the compressed image.
          ls -la
          sha256sum -- image_* kernel8-demo.img *.info > SHA256SUMS
          kernel=$(grep -oE 'Built kernel [^ ]+ from [0-9a-f]+' build.log | tail -n1 || true)
          slim=$(grep -oE 'stage-slim: rootfs .*' build.log | tail -n1 || true)
          {
            echo "Raspberry Pi 4 (arm64, Bookworm) release image: custom kernel, nginx demo page, Wi-Fi and Bluetooth; build tools, stock kernels and other extras removed."
            echo
            echo "- ${kernel:-kernel: see build.log}"
            echo "- ${slim:-size: see build.log}"
            echo "- pi-gen: $(git -C ../pi-gen rev-parse --short HEAD) (${{ github.repository }}@${{ github.sha }})"
            echo "- image: \`$(ls -- image_*)\` — flash with Raspberry Pi Imager, or boot with \`./run-qemu.sh\` (needs \`kernel8-demo.img\` next to it)"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMG_NAME }}
          retention-days: 7
          if-no-files-found: error
          path: |
            deploy/image_*
            deploy/kernel8-demo.img
            deploy/*.info
            deploy/build.log
            deploy/SHA256SUMS

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --notes-file deploy/RELEASE_NOTES.md \
            deploy/image_* deploy/kernel8-demo.img deploy/*.info deploy/build.log deploy/SHA256SUMS
