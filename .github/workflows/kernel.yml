# Build the custom kernel as a Debian package whenever its inputs change, and publish it
# as GitHub release "kernel-v<kernel/VERSION>" when the result is new.
#
#   pull request touching kernel/ ...  -> build, boot-test, upload artifact
#   push to main touching kernel/ ...  -> the same, then publish (see below)
#   workflow_dispatch                  -> build + artifact only
#
# Publishing is decided by the reproducible kernel Image, not by the trigger:
#   release kernel-v<VERSION> missing                  -> create it (tag included)
#   release exists, its Image hash == the one built    -> nothing changed, skip quietly
#   release exists, hash differs                       -> fail: bump kernel/VERSION
# So a Dockerfile or workflow edit that does not change the kernel is harmless, and a
# fragment or KERNEL_COMMIT change without a version bump cannot be published.
name: kernel

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'Dockerfile'
      - 'build-kernel.sh'
      - 'scripts/docker-env.sh'
      - 'scripts/qemu-smoke-test.sh'
      - 'run-qemu.sh'
      - '.github/workflows/kernel.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'Dockerfile'
      - 'build-kernel.sh'
      - 'scripts/docker-env.sh'
      - '.github/workflows/kernel.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/prepare-runner

      - name: Restore compiler cache
        # ccache turns the ~22 min from-scratch compile into a few minutes when only the
        # fragment or the packaging changed. Entries are immutable, so every run saves
        # under a new key and the next run restores the most recent one for the same
        # kernel inputs (falling back to any arm64 cache).
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-kernel-${{ runner.arch }}-${{ hashFiles('kernel/**', 'Dockerfile') }}-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-${{ runner.arch }}-${{ hashFiles('kernel/**', 'Dockerfile') }}-
            ccache-kernel-${{ runner.arch }}-

      - name: Build kernel package
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ./build-kernel.sh

      - name: Read result
        id: kernel
        run: |
          set -eu
          . deploy/kernel-release.env
          test "$KERNEL_VERSION" = "$(tr -d '[:space:]' < kernel/VERSION)"
          {
            echo "release=$KERNEL_RELEASE"
            echo "version=$KERNEL_VERSION"
            echo "deb=$KERNEL_DEB"
            echo "image_sha256=$(sha256sum deploy/kernel8-demo.img | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          ls -la deploy

      - name: Boot test in QEMU against the latest image release
        # The kernel alone cannot be booted; use the rootfs of the newest image release.
        # A fresh repository without an image release skips this step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
                  --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::notice::no image release yet, skipping the boot test"
            exit 0
          fi
          echo "booting kernel ${{ steps.kernel.outputs.release }} with the rootfs of $tag"
          mkdir -p smoke && gh release download "$tag" --pattern 'image_*' --dir smoke
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-arm xz-utils
          KERNEL=deploy/kernel8-demo.img scripts/qemu-smoke-test.sh smoke/image_* "${{ steps.kernel.outputs.release }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.kernel.outputs.deb }}
          retention-days: 14
          if-no-files-found: error
          path: |
            deploy/linux-image-*.deb
            deploy/kernel8-demo.img
            deploy/config-*
            deploy/overlays-README
            deploy/kernel-release.env
            deploy/SHA256SUMS

      - name: Decide whether to publish
        id: decide
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="kernel-v${{ steps.kernel.outputs.version }}"
          built="${{ steps.kernel.outputs.image_sha256 }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag does not exist yet: publishing"
            exit 0
          fi
          published=$(gh release download "$tag" --pattern SHA256SUMS --output - \
                        | awk '$2 == "kernel8-demo.img" {print $1}')
          if [ "$published" = "$built" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already published with an identical kernel Image ($built); nothing to do"
            exit 0
          fi
          echo "::error::$tag is already published with a different kernel Image (published $published, built $built). The kernel changed: bump kernel/VERSION in the PR that changes it."
          exit 1

      - name: Publish kernel release
        if: github.event_name == 'push' && steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          . deploy/kernel-release.env
          tag="kernel-v$KERNEL_VERSION"
          {
            echo "Custom Raspberry Pi 4 kernel \`$KERNEL_RELEASE\` as a Debian package."
            echo
            echo "- source: $KERNEL_GIT_URL branch $KERNEL_BRANCH, commit $KERNEL_COMMIT"
            echo "- config: $KERNEL_DEFCONFIG + kernel/demo.config (see \`config-$KERNEL_RELEASE\`)"
            echo "- built by ${{ github.repository }}@${{ github.sha }}; the Image is reproducible (sha256 in SHA256SUMS)"
            echo
            echo "Install on a running device: \`sudo apt install ./$KERNEL_DEB\`, then copy"
            echo "\`/boot/vmlinuz-$KERNEL_RELEASE\` to \`/boot/firmware/kernel8-demo.img\` (stage-kernel does this in images)."
            echo
            echo '```'
            cat deploy/SHA256SUMS
            echo '```'
          } > deploy/RELEASE_NOTES.md
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --notes-file deploy/RELEASE_NOTES.md \
            deploy/linux-image-*.deb deploy/kernel8-demo.img deploy/config-* \
            deploy/overlays-README deploy/kernel-release.env deploy/SHA256SUMS
