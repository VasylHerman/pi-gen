# Shared by kernel.yml and release.yml: free disk on the hosted runner and pick the
# largest filesystem for the pi-gen/kernel work directory.
name: Prepare runner
description: Reclaim disk space and export WORK_VOLUME pointing at the largest filesystem

runs:
  using: composite
  steps:
    - name: Reclaim disk space
      shell: bash
      # Hosted runners ship several GB of toolchains these builds never use.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                    /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h / /mnt 2>/dev/null

    - name: Place the work directory on the largest filesystem
      shell: bash
      # ~14 GB of stage rootfs copies and kernel objects for an image build. WORK_VOLUME
      # accepts a host path as well as a Docker volume name.
      run: |
        set -eu
        best=/; bestfree=0
        for m in / /mnt "$RUNNER_TEMP"; do
          [ -d "$m" ] || continue
          free=$(df -Pk "$m" | awk 'NR==2 {print $4}')
          if [ "$free" -gt "$bestfree" ]; then best=$m; bestfree=$free; fi
        done
        work="${best%/}/pigen-work"
        sudo mkdir -p "$work"
        echo "WORK_VOLUME=$work" >> "$GITHUB_ENV"
        echo "work dir: $work ($((bestfree / 1024 / 1024)) GB free)"
