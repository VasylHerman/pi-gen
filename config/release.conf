# Release variant (./build-release.sh): same build as dev, then stage-slim removes what
# a Wi-Fi/Bluetooth-capable nginx server does not need — compilers, stock kernels and
# headers, GPIO/camera/media tooling, foreign Wi-Fi firmware, docs, man pages and
# non-English locales. The custom kernel is the only kernel in this image.
# shellcheck source=config/common.conf
source "$(dirname "${BASH_SOURCE[0]}")/common.conf"

IMG_NAME="${IMG_NAME:-pi4-demo}"
DEPLOY_COMPRESSION="${DEPLOY_COMPRESSION:-xz}"    # pi-gen runs xz multi-threaded; ~30% smaller than zip
export RELEASE_SLIM=1
# Install the kernel package published as GitHub release kernel-v<kernel/VERSION>; the
# image never compiles a kernel. Set KERNEL_SOURCE=build in the environment to override.
export KERNEL_SOURCE="${KERNEL_SOURCE:-deb}"
