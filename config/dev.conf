# Development variant (./build-dev.sh): complete Raspberry Pi OS Lite base with the
# custom kernel and nginx on top. Keeps the stock kernel as a fallback, build tools,
# GPIO tooling, all Wi-Fi firmware — handy on the bench, ~660 MB zipped.
# shellcheck source=config/common.conf
source "$(dirname "${BASH_SOURCE[0]}")/common.conf"

IMG_NAME="${IMG_NAME:-pi4-demo-dev}"
DEPLOY_COMPRESSION="${DEPLOY_COMPRESSION:-zip}"   # none | zip | gz | xz
export RELEASE_SLIM=0
