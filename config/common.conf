# Settings shared by every image variant. Sourced by config/dev.conf and
# config/release.conf, which pi-gen/build.sh receives as `-c /build/config/<variant>.conf`,
# so this is bash syntax. ${BASE_DIR} is the pi-gen checkout. Variables consumed by our
# own stage scripts must be exported: pi-gen runs each *-run.sh as a child process.
# Reference for the upstream variables: pi-gen/README.md, section "Config".
#
# Per-variant (set in the variant file): IMG_NAME, DEPLOY_COMPRESSION, RELEASE_SLIM.

# Overridable from the environment (scripts/build-image.sh passes it through); the
# release workflow appends the tag.
PI_GEN_RELEASE="${PI_GEN_RELEASE:-Raspberry Pi 4 custom kernel demo}"
RELEASE="bookworm"

TARGET_HOSTNAME="pi-demo"        # reachable as http://pi-demo.local/ via avahi
LOCALE_DEFAULT="en_US.UTF-8"
KEYBOARD_KEYMAP="us"
KEYBOARD_LAYOUT="English (US)"
TIMEZONE_DEFAULT="UTC"

# DEMO ONLY: fixed user/password and SSH enabled so the board can be reached right
# after flashing. Do not ship an image like this.
ENABLE_SSH=1
FIRST_USER_NAME="pi"
FIRST_USER_PASS="raspberry"
DISABLE_FIRST_BOOT_USER_RENAME=1

# Upstream Lite stages (bootstrap, minimal, lite) followed by our stages, which live
# next to the pi-gen checkout. Order matters: stage-web bakes facts recorded by
# stage-kernel into the page; stage-slim (a no-op unless RELEASE_SLIM=1) comes last and
# carries EXPORT_IMAGE, so it is the rootfs that becomes the image in both variants.
STAGE_LIST="${BASE_DIR}/stage0 ${BASE_DIR}/stage1 ${BASE_DIR}/stage2 ${BASE_DIR}/../stage-kernel ${BASE_DIR}/../stage-web ${BASE_DIR}/../stage-slim"

# ---- kernel -----------------------------------------------------------------------
# All kernel inputs live under kernel/ (kernel.conf, VERSION, demo.config) so that the
# kernel workflow triggers on that directory alone. KERNEL_SOURCE (deb | build) is the
# image-side choice and is set per variant.
# shellcheck source=kernel/kernel.conf
source "$(dirname "${BASH_SOURCE[0]}")/../kernel/kernel.conf"
